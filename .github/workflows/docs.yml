# Docs gate (issue #53): repo-internal Markdown links and anchors resolve
# (lychee, offline, so a third-party site can't flake it), the ADR and review
# indexes list every file (ADRs in numeric order), and Markdown style is
# linted with a relaxed ruleset. PRs run it only when docs or their checks
# change. Advisory: not in the `main protection` ruleset, so a path-filtered
# skip never leaves a required check pending.
name: docs

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - lychee.toml
      - .markdownlint-cli2.jsonc
      - scripts/check-doc-indexes.mjs
      - .github/workflows/docs.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-doc-indexes.mjs
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress '**/*.md' '.github/**/*.md' # settings in lychee.toml
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md' # settings in .markdownlint-cli2.jsonc
