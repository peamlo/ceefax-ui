# Posts (or updates) the brotli size report on a pull request when a maintainer
# comments `/size` on it: the same report ci.yml's `size-comment` job posts on
# push, on demand, and on fork PRs too. Same split as preview.yml (ADR-0012):
# `build` runs the PR's code with read-only permissions, `comment` holds the
# write token and never checks out or runs PR code.
name: size

on:
  issue_comment:
    types: [created]

# Scopes are granted per job.
permissions: {}

env:
  PR: ${{ github.event.issue.number }}

jobs:
  ack:
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/size')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=eyes > /dev/null

  build:
    needs: ack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
            --jq '"head=\(.head.sha)\nbase=\(.base.sha)"' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pin.outputs.head }}
          persist-credentials: false
      # No npm cache: this runs in main's cache scope (see preview.yml).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      # As in ci.yml: the base build reuses this job's node_modules.
      - env:
          BASE_SHA: ${{ steps.pin.outputs.base }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"
          npm run build --prefix "$RUNNER_TEMP/base" > /dev/null
          node scripts/size.mjs . "$RUNNER_TEMP/base" > size.md
          cat size.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-report
          path: size.md
          retention-days: 1

  comment:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: size-report
      # Same upsert as ci.yml's `size-comment`, so both update one comment.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- size-report -->")) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@size.md > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file size.md
          fi
