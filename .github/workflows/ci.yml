# Builds the library, packs it as `npm publish` would, and asserts the tarball
# (issue #45): exports targets exist, font url()s resolve to packed files, fonts
# ship once, sideEffects keeps CSS + elements, publint passes, and each element
# subpath imports and registers from a clean install. The packed file list is
# printed to the log. The `security` job (issue #46) lints workflows with zizmor and
# reviews dependencies a PR adds. Both jobs are required by the `main protection`
# ruleset — see ADR-0002. The advisory `docs` job (issue #53) checks the Markdown.
# `package` also enforces the brotli size budgets (issue #47, ADR-0015); the
# advisory `size-comment` job posts the size report, with deltas, on the PR.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run assert-package
        env:
          FORCE_COLOR: '1' # the Actions log renders ANSI colour but isn't a TTY
      # Size report vs the base branch, even when a budget failed above. The base
      # build reuses this job's node_modules: a PostCSS + esbuild run, not a second npm ci.
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"
          npm run build --prefix "$RUNNER_TEMP/base" > /dev/null
          node scripts/size.mjs . "$RUNNER_TEMP/base" > size.md
          cat size.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-report
          path: size.md
          retention-days: 1

  # Posts (or updates) the size report comment. The only job with write access
  # to PRs, and it never checks out or runs PR code. Advisory: not in the
  # ruleset. Skipped on fork PRs, whose token can't comment.
  size-comment:
    needs: package
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: size-report
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- size-report -->")) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@size.md > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file size.md
          fi

  # Supply-chain gate (issue #46): zizmor lints the workflows (unpinned actions,
  # template injection, excess permissions) and dependency review flags any
  # dependency a PR adds with a high-severity advisory or a non-permissive
  # licence. Runs on every PR, with no `paths:` filter: it is a required check,
  # and a required check that never reports leaves the PR BLOCKED.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.16.3
          advanced-security: false # fail the job on findings instead of uploading SARIF
          annotations: true
      # Needs a base..head diff, so PRs only.
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            MIT, ISC, 0BSD, BSD-2-Clause, BSD-3-Clause, Apache-2.0, BlueOak-1.0.0,
            CC0-1.0, CC-BY-4.0, MPL-2.0, Python-2.0, Unlicense, WTFPL

  # Docs gate (issue #53): repo-internal Markdown links and anchors resolve
  # (lychee, offline, so a third-party site can't flake it), the ADR and review
  # indexes list every file (ADRs in numeric order), and Markdown style is
  # linted with a relaxed ruleset. Advisory: not in the `main protection`
  # ruleset, so skipping it on code-only PRs never blocks a merge.
  docs-changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Pushes to main always check; PRs only when docs or their checks change.
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ] || ! git diff --quiet "origin/$BASE_REF...HEAD" -- \
              '*.md' docs lychee.toml .markdownlint-cli2.jsonc scripts/check-doc-indexes.mjs \
              .github/workflows/ci.yml; then
            echo docs=true >> "$GITHUB_OUTPUT"
          fi

  docs:
    needs: docs-changes
    if: needs.docs-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-doc-indexes.mjs
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress '**/*.md' '.github/**/*.md' # settings in lychee.toml
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md' # settings in .markdownlint-cli2.jsonc
