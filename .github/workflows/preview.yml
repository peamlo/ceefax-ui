# Publishes a Storybook preview of a pull request to Cloudflare Pages when a
# maintainer comments `/preview` on it (issue #77). See ADR-0012: no job that
# holds the Cloudflare token checks out or runs PR code. `build` runs the PR's
# code with read-only permissions and no secrets; `deploy` only uploads the
# artifact it produced. Previews are deleted by preview-cleanup.yml.
name: preview

on:
  issue_comment:
    types: [created]

# Scopes are granted per job.
permissions: {}

env:
  PR: ${{ github.event.issue.number }}

jobs:
  ack:
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/preview')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=eyes > /dev/null

  build:
    needs: ack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      # The head commit right now is the pin; later pushes never change this preview.
      - id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pin.outputs.sha }}
          persist-credentials: false
      # No npm cache: this runs in main's cache scope. PR code can still reach the
      # runtime token, so the residual guard is npm ci's lockfile integrity check.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build-storybook
      # Same tree as pages.yml publishes, plus a 404.html: without one Cloudflare
      # Pages answers every missing path with index.html (issue #121).
      - run: |
          cp -r demo src fonts public storybook-static/
          echo '<!doctype html><title>404 Not Found</title><h1>404 Not Found</h1>' > storybook-static/404.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook
          path: storybook-static
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    environment: storybook-preview
    # Two `/preview` comments on one PR deploy one after the other; never cancel one.
    concurrency:
      group: preview-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      url: ${{ steps.wrangler.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook
          path: site
      - id: wrangler
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.151.3 # exact: npm code runs beside the token
          command: >-
            pages deploy site --project-name=ceefax-ui-preview --branch=pr-${{ env.PR }}
            --commit-hash=${{ needs.build.outputs.sha }} --commit-dirty=true

  publish:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The default branch's copy of the script, never the PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/smoke.sh
          sparse-checkout-cone-mode: false
      - env:
          URL: ${{ needs.deploy.outputs.url }}
        run: scripts/smoke.sh "$URL"
      # The deployment's own immutable URL, never the moving pr-<number> alias.
      - env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ needs.deploy.outputs.url }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Storybook preview of ${SHA:0:7}: $URL"

  report:
    needs: [build, deploy, publish]
    # A deploy cancelled by a newer queued `/preview` is not a failure; report it too.
    if: failure() || contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Storybook preview failed: $RUN"
