# Keeps one release PR open while `main` has unreleased feat/fix/perf work, and
# on its merge tags `v<version>` and creates the GitHub release (issue #49,
# ADR-0013). Versions and changelog come from release-please-config.json and
# .release-please-manifest.json. It acts as a GitHub App, never GITHUB_TOKEN:
# PRs and tags made with GITHUB_TOKEN start no workflows, so the release PR
# would never get its required checks and the tag would never start release.yml.
name: release-please

on:
  push:
    branches: [main]

# The App token carries the write scopes; GITHUB_TOKEN needs none.
permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
