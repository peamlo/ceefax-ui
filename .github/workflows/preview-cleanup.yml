# Deletes every Storybook preview of a pull request when it closes or merges
# (issue #77, ADR-0012). It never checks out the repo: it only calls the
# Cloudflare API, so it is safe on `pull_request_target`, which has the secrets
# on fork and Dependabot PRs too. A no-op for PRs that never had a preview.
name: preview-cleanup

on:
  pull_request_target:
    types: [closed]
    branches: [main] # the storybook-preview environment only allows main

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: storybook-preview
    steps:
      # ponytail: no retry sweep. A failed delete leaves a harmless static page;
      # add a scheduled sweep only if leftovers actually show up.
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: pr-${{ github.event.pull_request.number }}
        shell: bash # implies -eo pipefail
        run: |
          api() {
            curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ceefax-ui-preview/$1" "${@:2}"
          }
          # Collect every id first: deleting while paging would shift the pages.
          ids=()
          for ((page = 1; ; page++)); do
            res=$(api "deployments?env=preview&per_page=25&page=${page}")
            mapfile -t -O "${#ids[@]}" ids < <(jq -r --arg b "$BRANCH" \
              '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id' <<< "$res")
            [ "$(jq '.result | length' <<< "$res")" -lt 25 ] && break
          done
          # force=true also deletes the branch's aliased latest deployment.
          for id in "${ids[@]}"; do
            api "deployments/${id}?force=true" -X DELETE > /dev/null
          done
          echo "Deleted ${#ids[@]} deployment(s) on ${BRANCH}."
