name: PR Title Lint

# The repo merges via squash only, and the squash commit title is the PR title
# (repo setting squash_merge_commit_title=PR_TITLE). So the PR title is the commit
# that lands on main — validate it against the same commitlint config the local
# husky commit-msg hook uses (commitlint.config.js), keeping a single source of truth.
# `synchronize` re-runs it on every push: it is a required check, and a required
# check that hasn't reported on the PR's latest commit leaves the PR BLOCKED.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint PR title against commitlint
        # Pass the title via env, never interpolate ${{ }} into the shell — a PR
        # title is attacker-controllable and could otherwise inject commands.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx --no -- commitlint --verbose
