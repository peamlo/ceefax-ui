# Publishes the static Storybook to GitHub Pages (issue #29), with the demo
# pages alongside it at /demo/. The demo links ../src/index.css raw, so src/ and
# fonts/ are copied next to it unchanged — relative paths resolve as they do locally.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Scopes are granted per job: only `deploy` can write to Pages.
permissions: {}

# Serialise deploys; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: cp -r demo src fonts public storybook-static/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout of the smoke script
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/smoke.sh
          sparse-checkout-cone-mode: false
      - name: Smoke test the live site
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: scripts/smoke.sh "$URL"
