# Publishes the static Storybook to GitHub Pages (issue #29), with the demo
# pages alongside it at /demo/. The demo links ../src/index.css raw, so src/ and
# fonts/ are copied next to it unchanged — relative paths resolve as they do locally.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Scopes are granted per job: only `deploy` can write to Pages.
permissions: {}

# Serialise deploys; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: cp -r demo src fonts storybook-static/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Smoke test the live site
        shell: bash # implies -eo pipefail
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          get() { curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "${URL}$1"; }
          get "" > /dev/null
          # iframe.html is static (200 for any id), so the real check is a story in index.json.
          id=$(get index.json | jq -re '[.entries[] | select(.type == "story")][0].id')
          get "iframe.html?id=${id}" > /dev/null
          grep -q 'src/index.css' <<< "$(get demo/)"
          get src/index.css > /dev/null
          get fonts/vt323-v17-latin-regular.woff2 > /dev/null
