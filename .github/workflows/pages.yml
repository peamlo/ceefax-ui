# Publishes the static Storybook to GitHub Pages (issue #29), with the demo
# pages alongside it at /demo/. The demo links ../src/index.css raw, so src/ and
# fonts/ are copied next to it unchanged — relative paths resolve as they do locally.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Scopes are granted per job: only `deploy` can write to Pages.
permissions: {}

# Serialise deploys; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: cp -r demo src fonts storybook-static/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Smoke test the live site
        shell: bash # implies -eo pipefail
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          get() { curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "${URL}$1"; }
          get "" > /dev/null
          # iframe.html is static (200 for any id), so the real check is a story in index.json.
          id=$(get index.json | jq -re '[.entries[] | select(.type == "story")][0].id')
          get "iframe.html?id=${id}" > /dev/null
          grep -q 'src/index.css' <<< "$(get demo/)"
          get src/index.css > /dev/null
          get fonts/vt323-v17-latin-regular.woff2 > /dev/null
