# Runs the Storybook test-runner against a built Storybook: the story play()
# functions (contract interaction assertions) + the axe a11y pass on Components/*
# + html-validate over every story's rendered HTML (.htmlvalidate.js, #127).
# Per ADR-0002 this is a HARD gate — the `main protection` ruleset requires
# `test-storybook`, so a red run blocks merge. See ADR-0006.
name: storybook-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the PR cancels its in-flight runs (issue #158). Pushes to
# main get a group of their own (the run id), so no main run is ever dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Docs-only PRs skip `test-storybook` (issue #157). A copy of the `changes`
  # job in ci.yml, since `needs:` can't cross workflows: keep the two safe lists
  # in sync. Required jobs are skipped by `if:`, never by `paths:`: a job
  # skipped by `if:` reports as passed, but a workflow skipped by `paths:` never
  # reports and leaves the PR BLOCKED (ADR-0002).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qvE '\.md$|^docs/|^\.agents/|^skills-lock\.json$' <<< "$files"; then
            echo docs_only=false >> "$GITHUB_OUTPUT"
          else
            echo docs_only=true >> "$GITHUB_OUTPUT"
          fi

  # `!cancelled()`, not success: a failed `changes`, or one skipped on a push
  # to main, runs the tests.
  test-storybook:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Serve Storybook and run the test-runner
        # Every story, documentation ones included: they run cleanly now (ADR-0006). axe stays
        # gated to the contract stories inside the hook, not by path.
        run: |
          npx --no -- http-server storybook-static -p 6006 --silent &
          npx --no -- wait-on http://127.0.0.1:6006
          npm run test-storybook
