# Runs the story test gate: the stories tagged `contract`, in Vitest browser mode (Chromium),
# through the Storybook Vitest addon. Each story's play() carries its contract assertions;
# addon-a11y runs axe on the Components/* and Layout/Page screen-frame stories, once per theme
# (vitest.config.js). Per ADR-0002 this is a HARD gate — the `main protection` ruleset requires
# `test-storybook`, so a red run blocks merge. See ADR-0006.
name: storybook-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test-storybook
