# Runs the story test gate: every story as a Vitest test in browser mode (Playwright, Chromium)
# through the Storybook Vitest addon, with no Storybook build or server. Each story's play()
# carries its checks, real input included; the preview's hooks add the a11y addon's axe pass
# (failing on Components/* and the Screen frame), axe again under the accessible theme at AAA,
# and html-validate over every story's rendered HTML (.htmlvalidate.js, #127).
# Per ADR-0002 this is a HARD gate — the `main protection` ruleset requires
# `test-storybook`, so a red run blocks merge. See ADR-0006. A docs-only PR
# (changes.yml, issue #157) skips it by `if:`, never by `paths:`, so the
# required check still reports, as passed.
name: storybook-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the PR cancels its in-flight runs (issue #158). Pushes to
# main get a group of their own (the run id), so no main run is ever dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Docs-only PRs skip `test-storybook` (changes.yml, issue #157).
  changes:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/changes.yml
    permissions:
      pull-requests: read

  # `!cancelled()`, not success: a failed `changes`, or one skipped on a push
  # to main, runs the tests.
  test-storybook:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test-storybook
