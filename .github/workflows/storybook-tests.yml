# Runs the Storybook test-runner against a built Storybook: the story play()
# functions (contract interaction assertions) + the axe a11y pass on Components/*.
# Per ADR-0002 this is a HARD gate — the `main protection` ruleset requires
# `test-storybook`, so a red run blocks merge. See ADR-0006.
name: storybook-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Serve Storybook and run the test-runner
        # Scoped to the contract stories (issue #8's tested modules) by file path.
        # The Foundations/Layout documentation stories are out of scope and currently
        # destabilise the test-runner (60s "navigation" hangs) — see ADR-0006.
        run: |
          npx --no -- http-server storybook-static -p 6006 --silent &
          npx --no -- wait-on http://127.0.0.1:6006
          npm run test-storybook -- \
            stories/Button stories/Link stories/Card \
            stories/Fastext stories/Canvas stories/PaletteDrift \
            stories/VariantColours stories/TokenLayering \
            stories/AccessibleTheme \
            stories/layout/Page
