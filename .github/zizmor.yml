# zizmor config for the `security` job (issue #46). By default zizmor accepts
# tag pins (`actions/checkout@v5`) for GitHub's own `actions/*` namespace; this
# repo pins every action, first-party included, to a full commit SHA.
rules:
  unpinned-uses:
    config:
      policies:
        '*': hash-pin
  # Storybook previews need repo secrets on fork and Dependabot PRs, which only
  # these two triggers provide. Accepted under ADR-0012: no job holding the
  # Cloudflare token checks out or runs PR code. Every other workflow stays linted.
  dangerous-triggers:
    ignore:
      - preview.yml
      - preview-cleanup.yml
